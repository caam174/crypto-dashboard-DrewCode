<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Monitor 2.8"</title>
    <!-- Tailwind CSS para renderizado rápido -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Optimización estricta para pantallas TFT de 2.8 pulgadas (Resolución objetivo: 320x240 px) */
        body {
            background-color: #000000; /* Negro absoluto para maximizar el contraste y reducir fatiga del panel */
            color: #ffffff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            width: 320px;
            height: 240px;
            overflow: hidden; /* Evita scrollbars en pantallas embebidas */
        }
        .text-giant {
            font-size: 3.5rem; /* Tamaño masivo para la hora */
            line-height: 1;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-2 mx-auto select-none">

    <!-- SECCIÓN 1: RELOJ ULTRA MASIVO (REGLA DE PRIORIDAD VISUAL) -->
    <div class="text-center w-full mt-1">
        <div id="clock" class="text-giant font-bold tracking-tighter text-cyan-400 drop-shadow-[0_0_10px_rgba(34,211,238,0.4)]">
            00:00:00
        </div>
    </div>

    <!-- SECCIÓN 2: MATRIZ COMPACTA DE PRECIOS (BTC / ETH) -->
    <div class="grid grid-cols-2 gap-2 w-full my-1">
        <!-- BTC Box -->
        <div class="bg-zinc-900/80 border border-amber-500/30 rounded p-1.5 text-center">
            <div class="text-[10px] font-bold text-amber-500 uppercase tracking-tight">BTC/USDT</div>
            <div id="btc-price" class="text-sm font-bold text-slate-100 mt-0.5">$0.00</div>
        </div>
        <!-- ETH Box -->
        <div class="bg-zinc-900/80 border border-indigo-500/30 rounded p-1.5 text-center">
            <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-tight">ETH/USDT</div>
            <div id="eth-price" class="text-sm font-bold text-slate-100 mt-0.5">$0.00</div>
        </div>
    </div>

    <!-- SECCIÓN 3: TELEMETRÍA MÍNIMA DEL MINERO -->
    <div class="w-full bg-zinc-900/40 border border-emerald-500/20 rounded p-1.5 flex items-center justify-between mb-1">
        <div class="flex items-center gap-1.5">
            <span class="inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
            <span class="text-[10px] text-gray-400 font-bold uppercase">NerdMiner V2</span>
        </div>
        <div class="text-right">
            <span id="miner-hashrate" class="text-xs font-bold text-emerald-400">1,010 Kh/s</span>
        </div>
    </div>

    <!-- SCRIPT DE FLUJO DE DATOS -->
    <script>
        // Actualización síncrona del reloj (Formato 24h estricto)
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-PE', { 
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Feed de Datos de Alta Velocidad (WebSockets)
        const wsUrl = "wss://stream.binance.com:9443/ws/btcusdt@ticker/ethusdt@ticker";
        const ws = new WebSocket(wsUrl);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.s === "BTCUSDT") {
                const btcPrice = parseFloat(data.c).toLocaleString('en-US', { maximumFractionDigits: 0 });
                document.getElementById('btc-price').innerText = `$${btcPrice}`;
            }
            if (data.s === "ETHUSDT") {
                const ethPrice = parseFloat(data.c).toLocaleString('en-US', { maximumFractionDigits: 0 });
                document.getElementById('eth-price').innerText = `$${ethPrice}`;
            }
        };

        ws.onclose = () => { setTimeout(() => { location.reload(); }, 5000); };
    </script>
</body>
</html>
